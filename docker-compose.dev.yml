# Локальная разработка без GPU: только инфраструктура и сервисы.
# Ядро Open WebUI в dev запускается напрямую: backend/open_webui (uvicorn) + vite.
# Запуск: cp .env.example .env && docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-openwebui}
    ports:
      - '5432:5432'
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-dev
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data_dev:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - '6379:6379'

  encoder-classifier:
    build:
      context: ./services/encoder-classifier
    container_name: encoder-classifier-dev
    ports:
      - '8001:8001'
    environment:
      - MODELS_DIR=/models
      - ONNX_PROVIDERS=CPUExecutionProvider
    volumes:
      - ./models/encoders:/models

  ragas-worker:
    build:
      context: ./services/ragas-worker
    container_name: ragas-worker-dev
    ports:
      - '8002:8002'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openwebui}
      - REDIS_URL=redis://redis:6379/1
      - OPEN_WEBUI_URL=${OPEN_WEBUI_DEV_URL:-http://host.docker.internal:8080}
      - JUDGE_LLM_URL=${JUDGE_LLM_URL_DEV:-http://host.docker.internal:8000/v1}
      - EMBEDDINGS_URL=${EMBEDDINGS_URL_DEV:-http://host.docker.internal:8081/v1}
    depends_on:
      - postgres
      - redis

  voice-sip-bridge:
    build:
      context: ./services/voice-sip-bridge
    container_name: voice-bridge-dev
    ports:
      - '8765:8765'
    environment:
      - OPEN_WEBUI_URL=${OPEN_WEBUI_DEV_URL:-http://host.docker.internal:8080}
      - SPEACHES_URL=${SPEACHES_URL_DEV:-http://host.docker.internal:8003/v1}
      - AUDIOSOCKET_PORT=8765
    depends_on:
      - encoder-classifier

  # Д7 (Stage 3): one-shot экспорт стартовой ONNX-модели (профиль bootstrap)
  # Запуск: docker compose -f docker-compose.dev.yml --profile bootstrap run --rm bootstrap-models
  bootstrap-models:
    profiles: ["bootstrap"]
    build:
      context: ./services/encoder-classifier
    working_dir: /opt
    command: python /opt/scripts/bootstrap_models.py
    volumes:
      - ./:/opt:ro
      - ./models/encoders:/opt/models/encoders

volumes:
  pg_data_dev:
  qdrant_data_dev:
